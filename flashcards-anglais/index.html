let filtered=[],i=0,show=false,reviewOnly=false;const state=JSON.parse(localStorage.getItem('engcpge')||'{}');const cat=document.querySelector('#cat'),q=document.querySelector('#q'),a=document.querySelector('#a'),tag=document.querySelector('#tag'),hint=document.querySelector('#hint'),stats=document.querySelector('#stats');
function setup(){let cats=['Toutes les cartes',...new Set(C.map(x=>x.cat))];cat.innerHTML=cats.map(x=>`<option>${x}</option>`).join('');apply()}function apply(){let v=cat.value||'Toutes les cartes';filtered=C.map((x,k)=>({...x,k})).filter(x=>(v==='Toutes les cartes'||x.cat===v)&&(!reviewOnly||state[x.k]==='no'));i=0;render()}function render(){if(!filtered.length){q.textContent='Aucune carte à revoir ici.';a.hidden=true;tag.textContent='';stats.textContent='';return}i=(i+filtered.length)%filtered.length;let x=filtered[i];tag.textContent=x.cat;q.textContent=x.q;a.textContent=x.a;a.hidden=!show;hint.textContent=show?'Touchez pour masquer':'Touchez la carte pour afficher la réponse';let known=Object.values(state).filter(x=>x==='yes').length;stats.textContent=`Carte ${i+1}/${filtered.length} • ${known}/${C.length} connues • ${C.length} cartes au total`}
function flip(){show=!show;render()}document.querySelector('#card').onclick=flip;document.querySelector('#flip').onclick=flip;document.querySelector('#next').onclick=()=>{show=false;i++;render()};document.querySelector('#prev').onclick=()=>{show=false;i--;render()};document.querySelector('#yes').onclick=()=>{if(!filtered.length)return;state[filtered[i].k]='yes';localStorage.setItem('engcpge',JSON.stringify(state));show=false;i++;if(reviewOnly)apply();else render()};document.querySelector('#no').onclick=()=>{if(!filtered.length)return;state[filtered[i].k]='no';localStorage.setItem('engcpge',JSON.stringify(state));show=false;i++;render()};cat.onchange=()=>{reviewOnly=false;document.querySelector('#review').textContent='⚑ À revoir';apply()};document.querySelector('#shuffle').onclick=()=>{filtered.sort(()=>Math.random()-.5);i=0;show=false;render()};document.querySelector('#review').onclick=e=>{reviewOnly=!reviewOnly;e.target.textContent=reviewOnly?'✓ Toutes':'⚑ À revoir';apply()};setup();
