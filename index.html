let deck=F.slice(),fi=0,back=false, exos=E.slice(),ei=0;
const $=x=>document.getElementById(x), chapter=$("chapter");
["Tous les chapitres",...new Set(F.map(x=>x[0]))].forEach(n=>{let o=document.createElement("option");o.textContent=n;chapter.appendChild(o)});
function drawF(){back=false;let c=deck[fi];$("tag").textContent=c[0];$("fcontent").innerHTML=c[1];$("fcontent").className="maintext";$("fhint").textContent="Appuie pour voir la réponse";$("fcount").textContent=(fi+1)+" / "+deck.length;$("fbar").style.width=((fi+1)/deck.length*100)+"%"}
$("card").onclick=()=>{back=!back;let c=deck[fi];$("fcontent").innerHTML=back?c[2]:c[1];$("fcontent").className=back?"answer":"maintext";$("fhint").textContent=back?"Appuie pour revoir la question":"Appuie pour voir la réponse"};
$("fnext").onclick=()=>{fi=(fi+1)%deck.length;drawF()};$("fprev").onclick=()=>{fi=(fi-1+deck.length)%deck.length;drawF()};
chapter.onchange=()=>{deck=chapter.value==="Tous les chapitres"?F.slice():F.filter(c=>c[0]===chapter.value);fi=0;drawF()};
$("shuffle").onclick=()=>{for(let j=deck.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[deck[j],deck[k]]=[deck[k],deck[j]]}fi=0;drawF()};

function filterE(){let c=$("contest").value,l=+$("level").value;exos=E.filter(e=>(c==="Tous"||e[0]===c)&&(!l||e[1]===l));ei=0;drawE()}
function drawE(){let e=exos[ei];$("etype").textContent=e[0];$("estars").textContent="★".repeat(e[1])+"☆".repeat(4-e[1]);$("etitle").textContent=e[2];$("estatement").innerHTML=e[3];$("solution").innerHTML="<b>Correction</b><br><br>"+e[4];$("solution").classList.add("hidden");$("corr").textContent="Afficher la correction";$("ecount").textContent=(ei+1)+" / "+exos.length;$("ebar").style.width=((ei+1)/exos.length*100)+"%"}
$("corr").onclick=()=>{let s=$("solution");s.classList.toggle("hidden");$("corr").textContent=s.classList.contains("hidden")?"Afficher la correction":"Masquer la correction"};
$("enext").onclick=()=>{ei=(ei+1)%exos.length;drawE()};$("eprev").onclick=()=>{ei=(ei-1+exos.length)%exos.length;drawE()};$("contest").onchange=filterE;$("level").onchange=filterE;
$("tFlash").onclick=()=>{$("flashMode").classList.remove("hidden");$("exoMode").classList.add("hidden");$("tFlash").classList.add("on");$("tExo").classList.remove("on")};
$("tExo").onclick=()=>{$("exoMode").classList.remove("hidden");$("flashMode").classList.add("hidden");$("tExo").classList.add("on");$("tFlash").classList.remove("on")};
drawF();drawE();
</script></main></body></html>
