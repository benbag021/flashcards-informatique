<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards Informatique CPGE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1325;color:#f7f8ff;font-family:Arial,Helvetica,sans-serif;min-height:100vh}
main{max-width:760px;margin:auto;padding:22px 16px 40px}
h1{margin:0 0 5px;font-size:30px}.sub{color:#aab5cf;margin-bottom:20px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
select,button{font-size:16px;border-radius:12px;padding:11px 13px;border:1px solid #334164}
select{background:#151f38;color:white}.tool{background:#151f38;color:white}
.progress{height:7px;background:#202b47;border-radius:20px;margin-bottom:18px;overflow:hidden}
#bar{height:100%;background:#8ba5ff;width:0}
.card{min-height:390px;border-radius:24px;background:#17213b;border:1px solid #344364;box-shadow:0 16px 45px rgba(0,0,0,.35);padding:28px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none;transition:transform .18s}
.card:active{transform:scale(.985)}
.badge{position:absolute;margin-top:-325px;background:#27365f;color:#dce4ff;padding:7px 11px;border-radius:20px;font-size:13px;font-weight:bold}
#content{font-size:28px;line-height:1.35;font-weight:700}
#content.answer{font-size:22px;font-weight:500}
code{background:#0b1122;color:#e3e9ff;padding:3px 6px;border-radius:6px}
.tap{margin-top:35px;color:#9aa7c4;font-size:13px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.nav button{border:0;font-weight:bold;background:#28385f;color:white;padding:15px}
.nav #next{background:#8ba5ff;color:#0c1428}
#counter{text-align:center;color:#aab5cf;margin-top:13px}
</style>
</head>
<body>
<main>
<h1>Flashcards Informatique</h1>
<div class="sub">CPGE MP — touche la carte pour afficher la réponse</div>
<div class="toolbar">
<select id="chapter"></select>
<button class="tool" id="shuffle">Mélanger</button>
</div>
<div class="progress"><div id="bar"></div></div>
<div class="card" id="card">
<div class="badge" id="badge"></div>
<div id="content"></div>
<div class="tap" id="tap">Appuie pour voir la réponse</div>
</div>
<div class="nav"><button id="prev">← Précédente</button><button id="next">Suivante →</button></div>
<div id="counter"></div>
</main>
<script>
var allCards = [
["Bases Python","À quoi sert <code>print()</code> ?","À afficher une valeur ou un texte dans la console."],
["Bases Python","À quoi sert <code>input()</code> ?","À demander une saisie à l'utilisateur. Le résultat est une chaîne de caractères."],
["Bases Python","Comment convertir une chaîne en entier ?","Avec <code>int(chaine)</code>."],
["Bases Python","Quelle différence entre <code>=</code> et <code>==</code> ?","<code>=</code> affecte une valeur ; <code>==</code> teste une égalité."],
["Bases Python","Que renvoie <code>len(x)</code> ?","Le nombre d'éléments contenus dans <code>x</code>."],
["Boucles","Que produit <code>range(5)</code> ?","Les entiers 0, 1, 2, 3 et 4. La borne 5 est exclue."],
["Boucles","Quand utilise-t-on généralement <code>for</code> ?","Pour parcourir une séquence ou répéter une action un nombre déterminé de fois."],
["Boucles","Quand utilise-t-on généralement <code>while</code> ?","Pour répéter des instructions tant qu'une condition reste vraie."],
["Listes","Comment créer une liste vide ?","Avec <code>L = []</code>."],
["Listes","Comment ajouter <code>x</code> à la fin de <code>L</code> ?","Avec <code>L.append(x)</code>."],
["Listes","Comment accéder au premier élément de <code>L</code> ?","Avec <code>L[0]</code>."],
["Listes","Que désigne <code>L[-1]</code> ?","Le dernier élément de la liste."],
["Listes","Que fait <code>L[a:b]</code> ?","Une tranche allant de l'indice <code>a</code> inclus à <code>b</code> exclu."],
["Chaînes","Comment mettre une chaîne <code>s</code> en minuscules ?","Avec <code>s.lower()</code>."],
["Chaînes","Que fait <code>s.split()</code> ?","Découpe une chaîne et renvoie une liste de morceaux."],
["Fonctions","Comment définit-on une fonction ?","Avec <code>def nom(parametres):</code> puis un bloc indenté."],
["Fonctions","À quoi sert <code>return</code> ?","À renvoyer une valeur et terminer l'exécution de la fonction."],
["Fonctions","Différence entre <code>print</code> et <code>return</code> ?","<code>print</code> affiche une valeur ; <code>return</code> renvoie une valeur réutilisable."],
["Récursivité","Qu'est-ce qu'une fonction récursive ?","Une fonction qui s'appelle elle-même sur un problème plus petit."],
["Récursivité","Pourquoi faut-il un cas de base ?","Pour arrêter la récursion."],
["Complexité","Que signifie une complexité <code>O(n)</code> ?","Le nombre d'opérations croît linéairement avec la taille de l'entrée, à constante près."],
["Complexité","Complexité d'une recherche naïve dans une liste non triée ?","Dans le pire cas : <code>O(n)</code>."],
["SQL","Quelle commande permet de sélectionner des données ?","<code>SELECT</code>."],
["SQL","À quoi sert <code>WHERE</code> ?","À filtrer les lignes selon une condition."],
["SQL","À quoi sert <code>ORDER BY</code> ?","À trier le résultat d'une requête."],
["SQL","Que fait <code>COUNT(*)</code> ?","Compte le nombre de lignes du résultat."],
["SQL","À quoi sert une jointure ?","À combiner les informations de plusieurs tables liées."],
["Dictionnaires","Comment créer un dictionnaire vide ?","Avec <code>d = {}</code>."],
["Dictionnaires","Comment lire la valeur de clé <code>k</code> ?","Avec <code>d[k]</code>."],
["Piles / Files","Quel est le principe d'une pile ?","LIFO : dernier entré, premier sorti."],
["Piles / Files","Quel est le principe d'une file ?","FIFO : premier entré, premier sorti."],
["Graphes","Qu'est-ce qu'un sommet ?","Un nœud du graphe, pouvant être relié à d'autres sommets."],
["Graphes","Que fait un parcours en largeur (BFS) ?","Il explore le graphe niveau par niveau."]
];

var deck = allCards.slice(), index = 0, showingAnswer = false;
var chapter = document.getElementById("chapter");
var content = document.getElementById("content");
var badge = document.getElementById("badge");
var tap = document.getElementById("tap");
var counter = document.getElementById("counter");
var bar = document.getElementById("bar");

var names=["Tous les chapitres"];
for(var x=0;x<allCards.length;x++){if(names.indexOf(allCards[x][0])===-1) names.push(allCards[x][0]);}
for(var n=0;n<names.length;n++){var opt=document.createElement("option");opt.value=names[n];opt.textContent=names[n];chapter.appendChild(opt);}

function draw(){
 showingAnswer=false;
 var c=deck[index];
 badge.textContent=c[0];
 content.innerHTML=c[1];
 content.className="";
 tap.textContent="Appuie pour voir la réponse";
 counter.textContent=(index+1)+" / "+deck.length;
 bar.style.width=((index+1)/deck.length*100)+"%";
}
function flip(){
 showingAnswer=!showingAnswer;
 var c=deck[index];
 content.innerHTML=showingAnswer?c[2]:c[1];
 content.className=showingAnswer?"answer":"";
 tap.textContent=showingAnswer?"Appuie pour revoir la question":"Appuie pour voir la réponse";
}
document.getElementById("card").addEventListener("click",flip);
document.getElementById("next").addEventListener("click",function(){index=(index+1)%deck.length;draw();});
document.getElementById("prev").addEventListener("click",function(){index=(index-1+deck.length)%deck.length;draw();});
chapter.addEventListener("change",function(){
 deck=chapter.value==="Tous les chapitres"?allCards.slice():allCards.filter(function(c){return c[0]===chapter.value;});
 index=0;draw();
});
document.getElementById("shuffle").addEventListener("click",function(){
 for(var j=deck.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var tmp=deck[j];deck[j]=deck[k];deck[k]=tmp;}
 index=0;draw();
});
draw();
</script>
</body>
</html>
