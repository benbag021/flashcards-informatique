const E=[
["CCINP",1,"Somme des positifs","Écrire une fonction <code>somme_pos(L)</code> qui renvoie la somme des éléments strictement positifs d'une liste de nombres.","<pre>def somme_pos(L):\n    s = 0\n    for x in L:\n        if x > 0:\n            s += x\n    return s</pre>Un seul parcours : complexité temporelle <code>O(n)</code>."],

const OLD_EX = E.map((e,i)=>({
    type:e[0], level:e[1], title:e[2],
    qs:[["Q1",e[3],"Commence par identifier les données d'entrée, le résultat attendu et l'algorithme du cours correspondant.",e[4]]]
}));
const EX = [...DS, ...OLD_EX];

let deck=F.slice(),fi=0,back=false, exos=EX.slice(),ei=0;
const $=x=>document.getElementById(x), chapter=$("chapter");
["Tous les chapitres",...new Set(F.map(x=>x[0]))].forEach(n=>{let o=document.createElement("option");o.textContent=n;chapter.appendChild(o)});
function drawF(){back=false;let c=deck[fi];$("tag").textContent=c[0];$("fcontent").innerHTML=c[1];$("fcontent").className="maintext";$("fhint").textContent="Appuie pour voir la réponse";$("fcount").textContent=(fi+1)+" / "+deck.length;$("fbar").style.width=((fi+1)/deck.length*100)+"%"}
$("card").onclick=()=>{back=!back;let c=deck[fi];$("fcontent").innerHTML=back?c[2]:c[1];$("fcontent").className=back?"answer":"maintext";$("fhint").textContent=back?"Appuie pour revoir la question":"Appuie pour voir la réponse"};
$("fnext").onclick=()=>{fi=(fi+1)%deck.length;drawF()};$("fprev").onclick=()=>{fi=(fi-1+deck.length)%deck.length;drawF()};
chapter.onchange=()=>{deck=chapter.value==="Tous les chapitres"?F.slice():F.filter(c=>c[0]===chapter.value);fi=0;drawF()};
$("shuffle").onclick=()=>{for(let j=deck.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[deck[j],deck[k]]=[deck[k],deck[j]]}fi=0;drawF()};

function filterE(){
    let c=$("contest").value,l=+$("level").value;
    exos=EX.filter(e=>{
        let contestOK = c==="Tous" ||
            (c==="CCINP" && e.type.includes("CCINP")) ||
            (c==="Mines-Ponts" && e.type.includes("Mines-Ponts"));
        return contestOK && (!l || e.level===l);
    });
    ei=0; drawE();
}
function drawE(){
    if(exos.length===0){
        $("etype").textContent="Aucun exercice"; $("estars").textContent="";
        $("etitle").textContent="Aucun exercice avec ces filtres";
        $("estatement").innerHTML="Change le concours ou la difficulté.";
        $("hintbuttons").innerHTML=""; $("hintarea").innerHTML="";
        $("solution").innerHTML=""; $("ecount").textContent="0 / 0"; $("ebar").style.width="0%";
        return;
    }
    let e=exos[ei];
    $("etype").textContent=e.type;
    $("estars").textContent="★".repeat(e.level)+"☆".repeat(4-e.level);
    $("etitle").textContent=e.title;
    $("estatement").innerHTML=e.qs.map(q=>`<div class="qblock"><b>${q[0]}</b>${q[1]}</div>`).join("");
    $("hintbuttons").innerHTML=e.qs.map((q,i)=>`<button class="hintbtn" onclick="showHint(${i})">Indice ${q[0]}</button>`).join("");
    $("hintarea").innerHTML="";
    $("solution").innerHTML=e.qs.map(q=>`<div class="qblock"><b>${q[0]} — Réponse</b>${q[3]}</div>`).join("");
    $("efront").classList.remove("hidden"); $("eback").classList.add("hidden");
    $("ecount").textContent=(ei+1)+" / "+exos.length;
    $("ebar").style.width=((ei+1)/exos.length*100)+"%";
}
window.showHint=function(i){
    let q=exos[ei].qs[i];
    $("hintarea").innerHTML=`<div class="hintbox"><b>Indice ${q[0]}</b><br>${q[2]}</div>`;
    $("hintarea").scrollIntoView({behavior:"smooth",block:"nearest"});
}
$("flip").onclick=()=>{$("efront").classList.add("hidden");$("eback").classList.remove("hidden");$("eback").scrollTop=0};
$("flipback").onclick=()=>{$("eback").classList.add("hidden");$("efront").classList.remove("hidden");$("efront").scrollTop=0};
$("enext").onclick=()=>{if(exos.length){ei=(ei+1)%exos.length;drawE()}};
$("eprev").onclick=()=>{if(exos.length){ei=(ei-1+exos.length)%exos.length;drawE()}};
$("contest").onchange=filterE;$("level").onchange=filterE;
$("tFlash").onclick=()=>{$("flashMode").classList.remove("hidden");$("exoMode").classList.add("hidden");$("tFlash").classList.add("on");$("tExo").classList.remove("on")};
$("tExo").onclick=()=>{$("exoMode").classList.remove("hidden");$("flashMode").classList.add("hidden");$("tExo").classList.add("on");$("tFlash").classList.remove("on")};
drawF();drawE();
</script></main></body></html>
